version: '3'
services:
  prometheus:
    image: prom/prometheus@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    networks:
      - localprom
    ports:
      - 9090:9090
  osc-cost:
    image: outscale/osc-cost:v0.8.0
    networks:
      - localprom
    ports:
      - 8080:8080
    # Replace with your AK/SK
    # environment:
     # OSC_ACCESS_KEY: OSC_ACCESS_KEY
     # OSC_SECRET_KEY: OSC_SECRET_KEY
     # OSC_REGION: OSC_REGION     
  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    networks:
      - localprom
    ports:
      - 9100:9100
networks:
  localprom:
    driver: bridge
